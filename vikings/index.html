  document.querySelectorAll('[data-set-look]').forEach(function(b){
    b.addEventListener('click', function(){ document.documentElement.setAttribute('data-look', b.getAttribute('data-set-look'));
      try{ localStorage.setItem('look', b.getAttribute('data-set-look')); }catch(e){} setTiles(); });
  });

  // ---------- Map ----------
  var mapOk = !!window.L;
  var map, tiles, layer, shipMarker, animToken = 0;
  var loading = document.getElementById('loading');
  // Esri's World Physical Map: label-free, no API key, max zoom 8. (CARTO's basemaps now need a key and serve a watermark without one, found live 2026-10-18.)
  function tileUrl(){
    return 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Physical_Map/MapServer/tile/{z}/{y}/{x}';
  }
  function setTiles(){
    if (!map) return;
    if (tiles) map.removeLayer(tiles);
    tiles = L.tileLayer(tileUrl(), { maxZoom: 8, minZoom: 3,
      attribution: 'Map tiles: Esri, US National Park Service' });
    var failed = 0;
    tiles.on('tileerror', function(){ failed++; if (failed === 3) offline(); });
    tiles.on('load', function(){ loading.classList.add('hide'); });
    tiles.addTo(map);
  }
  function offline(){
    loading.classList.remove('hide');
    loading.innerHTML = '<div style="max-width:28ch;text-align:center;padding:16px">The map can\'t load right now (no internet). The episode recaps still work on the right.</div>';
  }
  if (mapOk) {
    map = L.map('map', { zoomControl: true, attributionControl: true, zoomSnap: 0.5 });
    map.fitBounds([[50.5, -9], [63.5, 24]]);
    setTiles();
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', setTiles);
    layer = L.layerGroup().addTo(map);
    map.on('click', function(){ animToken++; }); // a tap skips the animation
  } else { offline(); }

  function latlng(id){ var p = PL[id]; return [p.lat, p.lon]; }
  function labelIcon(text, cls){ return L.divIcon({ className: '', html: '<span class="lbl ' + (cls||'') + '">' + text + '</span>', iconAnchor: [-14, 14] }); }

  function placesUpTo(n){ // ids in order of first appearance, episodes 1..n
    var seen = [], last = n === 0 ? 9 : n;
    EPS.slice(0, last).forEach(function(e){ e.places.forEach(function(p){ if (seen.indexOf(p.id) < 0) seen.push(p.id); }); });
    return seen;
  }
  function journeysUpTo(n){ var last = n === 0 ? 9 : n, out = []; EPS.slice(0, last).forEach(function(e){ e.journeys.forEach(function(j){ out.push({ j: j, ep: e.n }); }); }); return out; }

  function drawMap(){
    if (!mapOk) return;
    layer.clearLayers(); animToken++;
    var n = state.ep, cur = n === 0 ? 9 : n;
    var css = getComputedStyle(document.documentElement);
    var pin = css.getPropertyValue('--pin').trim(), soft = css.getPropertyValue('--pin-soft').trim(), accent = css.getPropertyValue('--accent').trim();
    journeysUpTo(n).forEach(function(x){
      var isCur = n === 0 || x.ep === cur;
      L.polyline([latlng(x.j.from), latlng(x.j.to)], { color: accent, weight: isCur ? 5 : 3, dashArray: isCur ? '10 10' : '4 10', opacity: isCur ? 1 : .8 }).addTo(layer);
    });
    placesUpTo(n).forEach(function(id){
      var p = PL[id], ll = [p.lat, p.lon], inCur = EPS[cur - 1].places.some(function(q){ return q.id === id; });
      var col = (n === 0 || inCur) ? pin : soft;
      var m;
      if (p.kind === 'pin') m = L.circleMarker(ll, { radius: 13, color: col, weight: 3, fillColor: col, fillOpacity: 1 });
      else if (p.kind === 'area') m = L.circle(ll, { radius: p.radius_km * 1000, color: col, weight: 3, dashArray: '8 8', fillColor: col, fillOpacity: .12 });
      else if (p.kind === 'coast') m = L.rectangle([[ll[0] - .18, ll[1] - .3], [ll[0] + .18, ll[1] + .3]], { color: col, weight: 3, fill: false });
      else m = L.circleMarker(ll, { radius: 1, opacity: 0, fillOpacity: 0 });
      m.addTo(layer).on('click', function(){ openPlace(id); });
      L.marker(ll, { icon: labelIcon(p.name, p.kind === 'pin' ? '' : 'region'), interactive: true, keyboard: false }).addTo(layer).on('click', function(){ openPlace(id); });
    });
    animate();
  }

  function animate(){
    if (!mapOk) return;
    var n = state.ep, cur = n === 0 ? 9 : n;
    var legs = (n === 0 ? journeysUpTo(0).map(function(x){ return x.j; }) : EPS[cur - 1].journeys);
    if (shipMarker) { layer.removeLayer(shipMarker); shipMarker = null; }
    if (!legs.length) return;
    var token = ++animToken;
    var icon = L.divIcon({ className: 'ship', iconSize: [30, 30], iconAnchor: [15, 15],
      html: '<svg viewBox="0 0 30 30" aria-hidden="true"><path d="M3 17 L27 17 L22 25 L8 25 Z" fill="currentColor"/><path d="M15 4 L15 17" stroke="currentColor" stroke-width="2"/><path d="M15 5 L24 12 L15 12 Z" fill="currentColor"/></svg>' });
    shipMarker = L.marker(latlng(legs[0].from), { icon: icon, interactive: false, keyboard: false }).addTo(layer);
    shipMarker.getElement().style.color = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
    if (reduced) { shipMarker.setLatLng(latlng(legs[legs.length - 1].to)); return; }
    var per = Math.min(3000 / legs.length, 1500), i = 0;
    function leg(){
      if (token !== animToken || i >= legs.length) return;
      var a = latlng(legs[i].from), b = latlng(legs[i].to), t0 = performance.now();
      function step(now){
        if (token !== animToken) return;
        var t = Math.min(1, (now - t0) / per);
        shipMarker.setLatLng([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]);
        if (t < 1) requestAnimationFrame(step); else { i++; leg(); }
      }
      requestAnimationFrame(step);
    }
    leg();
  }
  document.getElementById('replay').addEventListener('click', function(){ animate(); });

  // ---------- Panel ----------
  var body = document.getElementById('body'), title = document.getElementById('ep-title'), sub = document.getElementById('ep-sub');
  document.getElementById('checked').textContent = D.source_note;
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function markClass(kind){ return kind === 'pin' ? '' : (kind === 'coast' ? 'coast' : 'region'); }

  function render(){
    var n = state.ep;
    document.getElementById('prev').disabled = (n === 0);
    document.getElementById('next').disabled = (n === 9);
    if (n === 0) { title.textContent = 'Vikings, Season 1'; sub.textContent = 'All of Season 1'; }
    else { title.textContent = 'Episode ' + n + ' of 9'; sub.textContent = EPS[n - 1].title; }
    body.scrollTop = 0;
    if (state.view === 'who') return renderWho();
    if (state.view === 'place') return renderPlace();
    var h = '';
    if (n === 0) {
      h += '<p>Tap › to start at episode 1, or tap an episode below. The map shows every place in Season 1.</p>';
      EPS.forEach(function(e){ h += '<button class="row" type="button" data-ep="' + e.n + '"><span style="min-width:2.2ch;font-weight:700">' + e.n + '</span><span>' + esc(e.title) + '</span></button>'; });
      h += '<h3>Places in Season 1</h3>';
      placesUpTo(0).forEach(function(id){ h += placeRow(id); });
    } else {
      var e = EPS[n - 1];
      h += '<p class="checked">First shown ' + esc(e.aired) + '</p>';
      h += '<p>' + esc(e.recap) + '</p>';
      h += '<h3>Places in this episode</h3>';
      e.places.forEach(function(p){ h += placeRow(p.id); });
    }
    body.innerHTML = h;
    body.querySelectorAll('[data-ep]').forEach(function(b){ b.addEventListener('click', function(){ go(+b.getAttribute('data-ep')); }); });
    body.querySelectorAll('[data-place]').forEach(function(b){ b.addEventListener('click', function(){ openPlace(b.getAttribute('data-place')); }); });
  }
  function placeRow(id){ var p = PL[id]; return '<button class="row" type="button" data-place="' + id + '"><span class="mark ' + markClass(p.kind) + '"></span><span>' + esc(p.name) + '</span></button>'; }

  function renderPlace(){
    var id = state.place, p = PL[id], n = state.ep, cur = n === 0 ? 9 : n;
    var h = '<button class="back" type="button" id="back">‹ Back to ' + (n === 0 ? 'Season 1' : 'episode ' + n) + '</button>';
    h += '<h2>' + esc(p.name) + '</h2>';
    if (p.label) h += '<div class="notice">' + esc(p.label) + '</div>';
    h += '<h3>In the show</h3>';
    var any = false;
    EPS.slice(0, cur).forEach(function(e){ e.places.forEach(function(q){ if (q.id === id) { any = true; h += '<p><b>Episode ' + e.n + '.</b> ' + esc(q.in_show) + '</p>'; } }); });
    if (!any) h += '<p>Nothing happens here up to this episode.</p>';
    h += '<h3>In history</h3>';
    h += p.history ? '<p>' + esc(p.history) + '</p>' : '<p>The checked guides say nothing more about this place, so neither does this map.</p>';
    body.innerHTML = h;
    document.getElementById('back').addEventListener('click', function(){ state.view = 'episode'; state.place = null; render(); });
  }
  function renderWho(){
    var h = '<button class="back" type="button" id="back">‹ Back</button><h2>Who\'s who at the end of Season 1</h2>';
    D.whos_who.forEach(function(c){ h += '<p><b>' + esc(c.name) + '.</b> ' + esc(c.line) + '</p>'; });
    body.innerHTML = h;
    document.getElementById('back').addEventListener('click', function(){ state.view = 'episode'; render(); });
  }
  function openPlace(id){
    state.view = 'place'; state.place = id; render();
    if (mapOk) { var p = PL[id]; map.flyTo([p.lat, p.lon], Math.max(map.getZoom(), p.kind === 'pin' ? 7 : 5), { animate: !reduced, duration: 1 }); }
  }
  function go(n){ state.ep = n; state.view = 'episode'; state.place = null; try{ localStorage.setItem('ep', n); }catch(e){} render(); drawMap(); if (mapOk) map.fitBounds([[50.5, -9], [63.5, 24]], { animate: !reduced }); }
  document.getElementById('prev').addEventListener('click', function(){ if (state.ep > 0) go(state.ep - 1); });
  document.getElementById('next').addEventListener('click', function(){ if (state.ep < 9) go(state.ep + 1); });
  document.getElementById('who').addEventListener('click', function(){ state.view = 'who'; render(); });

  var start = 0; try { start = +(localStorage.getItem('ep') || 0) || 0; } catch(e){}
  go(start);
})();
</script>
</body>
</html>
