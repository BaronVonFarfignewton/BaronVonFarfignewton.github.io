agnar's wife, stops him. Knut turns on Lagertha, and she kills him."}, {"id": "northumbria_coast", "in_show": "Then a large English force arrives at the beach where the Viking ships wait. The Vikings beat them and sail home."}, {"id": "kattegat", "in_show": "The Earl has Ragnar arrested. At the trial, Rollo backs Ragnar's story. Ragnar is set free. While Ragnar's people celebrate, the Earl's men attack them."}], "journeys": [{"from": "northumbria_coast", "to": "hexham", "who": "Ragnar's band", "why": "inland to the town"}, {"from": "hexham", "to": "northumbria_coast", "who": "Ragnar's band", "why": "back to the ships"}, {"from": "northumbria_coast", "to": "kattegat", "who": "the raiders", "why": "home"}], "video": {"youtube": "XELvE1WPGAY", "by": "HISTORY", "what": "HISTORY's recap of this episode, about 2 minutes"}}, {"n": 5, "title": "Raid", "aired": "Sunday 31 March 2013", "recap": "Earl Haraldson sends his men to attack Ragnar's farm. Ragnar's family escapes. Ragnar fights the Earl's men alone and is shot with an arrow. He gets away on a horse and reaches his family at the river. Athelstan pulls him out of the water. The family hides at the home of Floki, the boat builder. Floki treats Ragnar's wound. Meanwhile, the Earl marries his daughter Thyri to an older, rich earl from Sweden. Thyri's mother, Siggy, the Earl's wife, is unhappy about it. The Earl also takes Floki's boat. Rollo, Ragnar's brother, comes to the wedding. He asks the Earl to trust him. Siggy warns Rollo to leave. The Earl's men seize Rollo and torture him, to learn where Ragnar is. A man named Torstein brings Ragnar the news. Ragnar wants revenge. He and the Earl agree to settle it with a fight, man to man.", "places": [{"id": "kattegat", "in_show": "Earl Haraldson sends his men to attack Ragnar's farm. Ragnar's family escapes. The family hides at the home of Floki, the boat builder. The Earl's men seize Rollo and torture him, to learn where Ragnar is."}], "journeys": [], "video": {"youtube": "dAk0KY4-05U", "by": "HISTORY", "what": "HISTORY's recap of this episode, about 2 minutes"}}, {"n": 6, "title": "Burial of the Dead", "aired": "Sunday 7 April 2013", "recap": "Earl Haraldson agrees to fight Ragnar, one against one. Ragnar is still weak from his wound. The fight is to the death. Ragnar wins, and the Earl dies. Siggy, the Earl's widow, kills the cruel Swedish husband of her daughter Thyri. Ragnar is made the new Earl. Rollo, Ragnar's brother, swears loyalty to him. The old Earl gets a grand funeral. A slave woman is sacrificed to go with him into death. Athelstan, the English monk, is horrified. Lagertha, Ragnar's wife, says she is expecting a child. Rollo courts Siggy. Athelstan asks Ragnar about Ragnarök, the end of the world in Norse belief. Athelstan takes a drug and has a vision of it. In spring, Ragnar and his men sail back to England, up a river. King Aelle of Northumbria hears that they are coming and prepares.", "places": [{"id": "kattegat", "in_show": "Earl Haraldson agrees to fight Ragnar, one against one. Ragnar wins, and the Earl dies. Ragnar is made the new Earl. The old Earl gets a grand funeral."}, {"id": "northumbria", "in_show": "In spring, Ragnar and his men sail back to England, up a river. King Aelle of Northumbria hears that they are coming and prepares."}], "journeys": [{"from": "kattegat", "to": "northumbria_coast", "who": "Ragnar and his men", "why": "back to England in spring"}], "video": {"youtube": "9Mf7y9_ouEE", "by": "HISTORY", "what": "HISTORY's recap of this episode, about 2 minutes"}}, {"n": 7, "title": "A King's Ransom", "aired": "Sunday 14 April 2013", "recap": "Ragnar and his men set up a battle camp in England. King Aelle sends his brother to lead the English army against them. The Vikings attack the English camp at night. They capture the king's brother. Ragnar asks for 2,000 pounds of gold to set him free. Aelle agrees, on one condition: one of the Vikings must be baptized as a Christian. Rollo, Ragnar's brother, volunteers. Floki, the boat builder, is disgusted. Rollo says it was only a joke. The gold turns out to be a trap, and Aelle's men attack. The Vikings beat them off. Ragnar has the king's brother killed. Aelle then pays the gold, and vows revenge. At home, Lagertha, Ragnar's wife, rules in his place. Siggy, the old Earl's widow, asks to serve her. Lagertha loses the baby she was expecting.", "places": [{"id": "northumbria", "in_show": "Ragnar and his men set up a battle camp in England. The Vikings attack the English camp at night. They capture the king's brother. Ragnar asks for 2,000 pounds of gold to set him free. Aelle then pays the gold, and vows revenge."}, {"id": "kattegat", "in_show": "At home, Lagertha, Ragnar's wife, rules in his place. Siggy, the old Earl's widow, asks to serve her. Lagertha loses the baby she was expecting."}], "journeys": [], "video": {"youtube": "ma5ANbPlS2s", "by": "HISTORY", "what": "HISTORY's recap of this episode, about 2 minutes"}}, {"n": 8, "title": "Sacrifice", "aired": "Sunday 21 April 2013", "recap": "Ragnar grieves for the son that Lagertha, his wife, lost. He takes his family and his people to the great temple at Uppsala, in Sweden. They go for a festival of the Norse gods. Athelstan, the English monk, goes with them. Animals have been brought to be sacrificed, and people will be too. King Horik of Denmark comes to the festival. Ragnar pledges his loyalty to Horik. Horik wants Ragnar's help against an earl who is troubling him. Siggy, the old Earl's widow, scolds Rollo, Ragnar's brother, for drinking and chasing women. The priests question Athelstan about his Christian faith. They ask him three times to deny it. They decide he has not truly given it up. So they judge him unfit to be sacrificed. Athelstan learns that he was brought there to be the sacrifice. A man named Leif volunteers to die in his place. The animals are sacrificed, and then Leif.", "places": [{"id": "uppsala", "in_show": "He takes his family and his people to the great temple at Uppsala, in Sweden. They go for a festival of the Norse gods. King Horik of Denmark comes to the festival. Ragnar pledges his loyalty to Horik. A man named Leif volunteers to die in his place. The animals are sacrificed, and then Leif."}], "journeys": [{"from": "kattegat", "to": "uppsala", "who": "Ragnar, his family and his people", "why": "the festival of the gods"}], "video": {"youtube": "c5VoO15xWMY", "by": "HISTORY", "what": "HISTORY's recap of this episode, about 2 minutes"}}, {"n": 9, "title": "All Change", "aired": "Sunday 28 April 2013", "recap": "King Horik sends Ragnar to Götaland, in Sweden, to settle a land quarrel with Jarl Borg. A jarl is the same as an earl. Ragnar travels with a small party, including Rollo, his brother, and Bjorn, his son. On the way, Ragnar's men find a woman bathing. She is Aslaug, a princess. Ragnar sleeps with her. Bjorn is upset that his father has betrayed Lagertha, his mother. Ragnar carries terms between Borg and Horik, but Horik will not bend. The talks fail. Rollo agrees to side with Borg against Ragnar. At home, a plague sweeps the village. Many people die. Lagertha's daughter Gyda dies. So does Siggy's daughter Thyri. Lagertha goes to the seer, a blind holy man, for comfort, but he will not tell her much. At the end, Aslaug tells Ragnar she is carrying his child.", "places": [{"id": "gotaland", "in_show": "King Horik sends Ragnar to Götaland, in Sweden, to settle a land quarrel with Jarl Borg. On the way, Ragnar's men find a woman bathing. She is Aslaug, a princess. The talks fail. Rollo agrees to side with Borg against Ragnar."}, {"id": "kattegat", "in_show": "At home, a plague sweeps the village. Many people die. Lagertha's daughter Gyda dies. So does Siggy's daughter Thyri."}], "journeys": [{"from": "kattegat", "to": "gotaland", "who": "Ragnar, Rollo, Bjorn and a small party", "why": "to settle the land quarrel"}], "video": {"youtube": "jCzUbG9fDUk", "by": "HISTORY", "what": "HISTORY's recap of this episode, about 2 minutes"}}], "whos_who": [{"name": "Ragnar Lothbrok", "line": "A farmer and raider. Earl since episode 6. He has pledged loyalty to King Horik; his talks with Jarl Borg failed; Aslaug says she carries his child.", "rows": ["WW-Ragnar"]}, {"name": "Lagertha", "line": "Ragnar's wife, a shield-maiden. She lost a pregnancy and then her daughter Gyda; the seer told her little.", "rows": ["WW-Lagertha"]}, {"name": "Rollo", "line": "Ragnar's brother. He has sided with Jarl Borg against Ragnar.", "rows": ["WW-Rollo#1", "WW-Rollo#2"]}, {"name": "Bjorn", "line": "Son of Ragnar and Lagertha. He is with Ragnar on the Götaland trip and upset at his father's unfaithfulness.", "rows": ["WW-Bjorn"]}, {"name": "Gyda", "line": "Daughter of Ragnar and Lagertha. She died of the plague.", "rows": ["WW-Gyda"]}, {"name": "Floki", "line": "A boat builder and Ragnar's friend.", "rows": ["WW-Floki#1"]}, {"name": "Athelstan", "line": "An English monk taken at Lindisfarne, now Ragnar's slave.", "rows": ["WW-Athelstan#1"]}, {"name": "Siggy", "line": "Earl Haraldson's wife, now his widow. She entered Lagertha's service and lost her daughter Thyri.", "rows": ["WW-Siggy"]}, {"name": "Thyri", "line": "Daughter of Haraldson and Siggy. She died of the plague.", "rows": ["WW-Thyri"]}, {"name": "King Horik", "line": "King of Denmark. Ragnar pledged to him; he would not bend in the talks.", "rows": ["WW-Horik"]}, {"name": "Jarl Borg", "line": "An earl in Götaland, in a land quarrel with Horik. Rollo now backs him.", "rows": ["WW-Borg#1"]}, {"name": "Aslaug", "line": "A princess. She tells Ragnar she is carrying his child.", "rows": ["WW-Aslaug"]}, {"name": "King Aelle", "line": "King of Northumbria in the show. He paid the ransom and vowed revenge.", "rows": ["WW-Aelle"]}, {"name": "Earl Haraldson", "line": "The local ruler at the start. Ragnar killed him in single combat in episode 6.", "rows": ["WW-Dead#1", "6.2"]}], "season_video": {"youtube": "_afkWYn1JE4", "by": "HISTORY", "what": "HISTORY's 2-minute recap of the whole of Season 1"}, "video_note": "Videos are HISTORY's own uploads, checked 2026-10-18; see research/clips_official.md."}</script>

    var n = state.ep, cur = n === 0 ? 9 : n;
    var pin = css('--mappin'), soft = css('--mappin-soft'), accent = css('--maproute'), panel = css('--mapring');
    journeysUpTo(n).forEach(function(x){
      var isCur = n === 0 || x.ep === cur;
      L.polyline(arc(latlng(x.j.from), latlng(x.j.to)), { color: accent, weight: isCur ? 3.5 : 2.5, opacity: isCur ? .95 : .35, lineCap: 'round' }).addTo(layer);
    });
    placesUpTo(n).forEach(function(id){
      var p = PL[id], s = SHOW[id] || { short: p.name, dir: 'right', off: [12, 0] }, ll = [p.lat, p.lon];
      var inCur = EPS[cur - 1].places.some(function(q){ return q.id === id; });
      var col = (n === 0 || inCur) ? pin : soft, m;
      if (p.kind === 'pin') m = L.circleMarker(ll, { radius: 9, color: panel, weight: 3, fillColor: col, fillOpacity: 1 });
      else if (p.kind === 'area') m = L.circle(ll, { radius: p.radius_km * 1000, color: col, weight: 2, dashArray: '6 6', fillColor: col, fillOpacity: .14 });
      else if (p.kind === 'coast') m = L.circleMarker(ll, { radius: 8, color: col, weight: 3, fillColor: panel, fillOpacity: 1 });
      else m = L.circleMarker(ll, { radius: 1, opacity: 0, fillOpacity: 0, interactive: false });
      m.addTo(layer);
      if (p.kind !== 'region') m.on('click', function(){ openPlace(id); });
      var html = s.short + (s.sub ? '<small>' + s.sub + '</small>' : '');
      var z = map.getZoom();
      var cls = 'plabel' + (p.kind === 'region' || p.kind === 'coast' ? ' region' : '') + (s.farHide ? ' far' : '') + (s.far5 ? ' far5' : '')
        + ((s.farHide && z < 6) || (s.far5 && z < 4.4) ? ' hide-far' : '');
      m.bindTooltip(html, { permanent: true, direction: s.dir, offset: s.off, className: cls, interactive: true, opacity: 1 });
      m.getTooltip().on('click', function(){ if (p.kind !== 'region') openPlace(id); });
    });
    animate();
  }

  function animate(){
    if (!mapOk) return;
    var n = state.ep, cur = n === 0 ? 9 : n;
    var legs = (n === 0 ? journeysUpTo(0).map(function(x){ return x.j; }) : EPS[cur - 1].journeys);
    if (shipMarker) { layer.removeLayer(shipMarker); shipMarker = null; }
    if (!legs.length) return;
    var token = ++animToken;
    var icon = L.divIcon({ className: 'ship', iconSize: [34, 34], iconAnchor: [17, 17],
      html: '<svg viewBox="0 0 34 34" aria-hidden="true"><path d="M4 20 Q17 26 30 20 L26 27 L8 27 Z" fill="currentColor"/><path d="M17 5 L17 20" stroke="currentColor" stroke-width="2.2"/><path d="M17 6 L27 14 L17 14 Z" fill="currentColor"/></svg>' });
    var paths = legs.map(function(l){ return arc(latlng(l.from), latlng(l.to)); });
    shipMarker = L.marker(paths[0][0], { icon: icon, interactive: false, keyboard: false }).addTo(layer);
    if (reduced) { var last = paths[paths.length - 1]; shipMarker.setLatLng(last[last.length - 1]); return; }
    var per = Math.min(3000 / legs.length, 1600), i = 0;
    function leg(){
      if (token !== animToken || i >= paths.length) return;
      var pts = paths[i], t0 = performance.now();
      function step(now){
        if (token !== animToken) return;
        // The first frame's timestamp can be earlier than t0, so clamp at 0 too; a negative t gave pts[-1] and an error.
        var t = Math.max(0, Math.min(1, (now - t0) / per)), k = Math.min(pts.length - 1, Math.floor(t * (pts.length - 1)));
        shipMarker.setLatLng(pts[k]);
        if (t < 1) requestAnimationFrame(step); else { i++; leg(); }
      }
      requestAnimationFrame(step);
    }
    leg();
  }
  document.getElementById('replay').addEventListener('click', function(){ animate(); });

  // ---------- Panel ----------
  var body = document.getElementById('body'), title = document.getElementById('ep-title'), sub = document.getElementById('ep-sub');
  document.getElementById('checked').textContent = D.source_note;
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function markClass(kind){ return kind === 'pin' ? '' : (kind === 'coast' ? 'coast' : 'region'); }
  function placeRow(id){ var p = PL[id]; return '<button class="row" type="button" data-place="' + id + '"><span class="mark ' + markClass(p.kind) + '"></span><span>' + esc(p.name) + '</span><span class="chev">›</span></button>'; }
  function videoBlock(v, label){ // still first; the player loads only on his tap, so nothing plays or phones home unasked
    if (!v || !v.youtube) return '';
    var id = esc(v.youtube);
    return '<div class="video" data-yt="' + id + '"><img src="https://i.ytimg.com/vi/' + id + '/hqdefault.jpg" alt="" loading="lazy">' +
      '<button class="play" type="button" aria-label="Play ' + esc(label) + '"><span class="tri">▶</span><span>Play ' + esc(label) + '</span></button></div>' +
      '<p class="vcap">' + esc(v.what) + '. Video by ' + esc(v.by) + '.</p>';
  }
  function wireVideos(){
    body.querySelectorAll('.video .play').forEach(function(b){
      b.addEventListener('click', function(){
        var box = b.parentNode, id = box.getAttribute('data-yt');
        box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?rel=0&autoplay=1&playsinline=1" title="Recap video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
      });
    });
  }

  function render(){
    var n = state.ep;
    document.getElementById('prev').disabled = (n === 0);
    document.getElementById('next').disabled = (n === 9);
    if (n === 0) { title.textContent = 'Vikings, Season 1'; sub.textContent = 'All of Season 1'; }
    else { title.textContent = 'Episode ' + n + ' of 9'; sub.textContent = EPS[n - 1].title; }
    body.scrollTop = 0;
    if (state.view === 'who') return renderWho();
    if (state.view === 'place') return renderPlace();
    var h = '';
    if (n === 0) {
      h += '<p>Tap › to start at episode 1, or tap an episode below. The map shows every place in Season 1.</p>';
      EPS.forEach(function(e){ h += '<button class="row" type="button" data-ep="' + e.n + '"><span class="n">' + e.n + '</span><span>' + esc(e.title) + '</span><span class="chev">›</span></button>'; });
      h += '<h3>The whole season in two minutes</h3>' + videoBlock(D.season_video, 'the Season 1 recap');
      h += '<h3>Places in Season 1</h3>';
      placesUpTo(0).forEach(function(id){ h += placeRow(id); });
    } else {
      var e = EPS[n - 1];
      h += '<p class="aired">First shown ' + esc(e.aired) + '</p>';
      h += '<p>' + esc(e.recap) + '</p>';
      h += '<h3>Watch the recap</h3>' + videoBlock(e.video, 'the episode ' + n + ' recap');
      h += '<h3>Places in this episode</h3>';
      e.places.forEach(function(p){ h += placeRow(p.id); });
    }
    body.innerHTML = h;
    wireVideos();
    body.querySelectorAll('[data-ep]').forEach(function(b){ b.addEventListener('click', function(){ go(+b.getAttribute('data-ep')); }); });
    body.querySelectorAll('[data-place]').forEach(function(b){ b.addEventListener('click', function(){ openPlace(b.getAttribute('data-place')); }); });
  }
  function renderPlace(){
    var id = state.place, p = PL[id], n = state.ep, cur = n === 0 ? 9 : n;
    var h = '<button class="back" type="button" id="back">‹ Back to ' + (n === 0 ? 'Season 1' : 'episode ' + n) + '</button>';
    h += '<h2>' + esc(p.name) + '</h2>';
    if (p.label) h += '<div class="notice">' + esc(p.label) + '</div>';
    h += '<h3>In the show</h3>';
    var any = false;
    EPS.slice(0, cur).forEach(function(e){ e.places.forEach(function(q){ if (q.id === id) { any = true; h += '<p><b>Episode ' + e.n + '.</b> ' + esc(q.in_show) + '</p>'; } }); });
    if (!any) h += '<p>Nothing happens here up to this episode.</p>';
    h += '<h3>In history</h3>';
    h += p.history ? '<p>' + esc(p.history) + '</p>' : '<p>The checked guides say nothing more about this place, so neither does this map.</p>';
    body.innerHTML = h;
    document.getElementById('back').addEventListener('click', function(){ state.view = 'episode'; state.place = null; render(); fitEpisode(); });
  }
  function renderWho(){
    var h = '<button class="back" type="button" id="back">‹ Back</button><h2>Who\'s who at the end of Season 1</h2>';
    D.whos_who.forEach(function(c){ h += '<p><b>' + esc(c.name) + '.</b> ' + esc(c.line) + '</p>'; });
    h += '<p class="checked">Map tiles: Esri, US National Park Service. Coastlines: Natural Earth.</p>';
    body.innerHTML = h;
    document.getElementById('back').addEventListener('click', function(){ state.view = 'episode'; render(); });
  }
  function openPlace(id){
    state.view = 'place'; state.place = id; render();
    if (mapOk) { var p = PL[id]; map.flyTo([p.lat, p.lon], Math.max(map.getZoom(), p.kind === 'pin' ? 6.5 : 5), { animate: !reduced, duration: .9 }); }
  }
  function fitEpisode(){
    if (!mapOk) return;
    var n = state.ep;
    if (n === 0) { map.flyToBounds(HOME, Object.assign({ animate: !reduced, duration: .9 }, PAD)); return; }
    var pts = [];
    EPS[n - 1].places.forEach(function(p){ pts.push(latlng(p.id)); });
    EPS[n - 1].journeys.forEach(function(j){ pts.push(latlng(j.from)); pts.push(latlng(j.to)); });
    if (pts.length < 2) { pts.push([pts[0][0] + 2.5, pts[0][1] + 5]); pts.push([pts[0][0] - 2.5, pts[0][1] - 5]); }
    map.flyToBounds(L.latLngBounds(pts).pad(.3), Object.assign({ animate: !reduced, duration: .9, maxZoom: 6.5 }, PAD));
  }
  function go(n){ state.ep = n; state.view = 'episode'; state.place = null; try{ localStorage.setItem('ep', n); }catch(e){} render(); drawMap(); fitEpisode(); }
  document.getElementById('prev').addEventListener('click', function(){ if (state.ep > 0) go(state.ep - 1); });
  document.getElementById('next').addEventListener('click', function(){ if (state.ep < 9) go(state.ep + 1); });
  document.getElementById('who').addEventListener('click', function(){ state.view = 'who'; render(); });

  var start = 0; try { start = +(localStorage.getItem('ep') || 0) || 0; } catch(e){}
  go(start);
})();
</script>
</body>
</html>
